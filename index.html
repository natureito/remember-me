<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REMEMBER ME</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f5f5f3;--bg3:#eeede9;
  --text:#1a1a1a;--text2:#666;--text3:#999;
  --border:rgba(0,0,0,0.12);--border2:rgba(0,0,0,0.2);
  --radius:8px;--radius-lg:12px;
}
[data-theme="dark"]{
  --bg:#1a1a1a;--bg2:#242424;--bg3:#2e2e2e;
  --text:#f0f0f0;--text2:#aaa;--text3:#666;
  --border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.2);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background 0.2s,color 0.2s}
.container{max-width:760px;margin:0 auto;padding:0 1.25rem}
.site-header{padding:2rem 0 1.5rem;text-align:center;border-bottom:0.5px solid var(--border);position:relative}
.site-title{font-size:32px;font-weight:500;letter-spacing:0.08em}
.site-sub{font-size:13px;color:var(--text2);margin-top:8px;line-height:1.6}
.header-actions{position:absolute;top:50%;right:0;transform:translateY(-50%);display:flex;gap:6px;align-items:center}
.theme-btn,.tool-btn{background:none;border:0.5px solid var(--border2);border-radius:var(--radius);padding:6px 12px;font-size:12px;color:var(--text2);cursor:pointer}
.theme-btn:hover,.tool-btn:hover{background:var(--bg2)}
.decade-tabs{display:flex;gap:6px;padding:1.25rem 0 0;overflow-x:auto;scrollbar-width:none}
.decade-tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:6px 16px;border-radius:var(--radius);border:0.5px solid var(--border);font-size:13px;color:var(--text2);cursor:pointer;background:transparent;transition:all 0.15s}
.tab:hover{background:var(--bg2)}
.tab.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.tab-count{font-size:11px;opacity:0.6;margin-left:4px}
.section-header{display:flex;align-items:center;justify-content:space-between;padding:1.5rem 0 0.75rem}
.section-title{font-size:20px;font-weight:500}
.section-count{font-size:13px;font-weight:400;color:var(--text3);margin-left:8px}
.add-btn{padding:7px 16px;border-radius:var(--radius);border:0.5px solid var(--border2);font-size:13px;color:var(--text);cursor:pointer;background:transparent}
.add-btn:hover{background:var(--bg2)}
.form-panel{background:var(--bg2);border-radius:var(--radius-lg);border:0.5px solid var(--border);padding:1.25rem;margin-bottom:1rem;display:none}
.form-panel.open{display:block}
.form-title{font-size:14px;font-weight:500;margin-bottom:12px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.form-full{grid-column:1/-1}
.form-label{font-size:12px;color:var(--text2);margin-bottom:4px;display:block}
.form-optional{font-size:11px;color:var(--text3);margin-left:4px}
input,textarea,select{width:100%;border:0.5px solid var(--border);border-radius:var(--radius);padding:8px 10px;font-size:13px;background:var(--bg);color:var(--text);font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--border2)}
textarea{resize:vertical;min-height:64px}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.btn-save{padding:7px 20px;border-radius:var(--radius);background:var(--text);color:var(--bg);border:none;font-size:13px;cursor:pointer}
.btn-cancel{padding:7px 16px;border-radius:var(--radius);background:transparent;color:var(--text2);border:0.5px solid var(--border);font-size:13px;cursor:pointer}
.song-list{display:flex;flex-direction:column;gap:8px;padding-bottom:3rem}
.song-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px;display:flex;gap:12px;align-items:flex-start;cursor:grab;user-select:none}
.song-card:active{cursor:grabbing}
.song-card.dragging{opacity:0.35}
.song-card.drag-over{border-color:var(--text2);background:var(--bg2)}
.drag-handle{color:var(--text3);font-size:16px;padding-top:3px;flex-shrink:0}
.rank{font-size:13px;font-weight:500;color:var(--text3);min-width:22px;padding-top:3px;text-align:right;flex-shrink:0}
.song-thumb{width:72px;height:54px;border-radius:6px;object-fit:cover;flex-shrink:0;background:var(--bg3)}
.song-thumb-placeholder{width:72px;height:54px;border-radius:6px;flex-shrink:0;background:var(--bg3);display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:20px}
.song-info{flex:1;min-width:0}
.song-title{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-meta{display:flex;gap:8px;align-items:center;margin-top:3px;flex-wrap:wrap}
.song-artist{font-size:12px;color:var(--text2)}
.song-year{font-size:11px;color:var(--text3);background:var(--bg3);padding:1px 6px;border-radius:4px;flex-shrink:0}
.song-comment{font-size:12px;color:var(--text3);margin-top:5px;line-height:1.6;white-space:pre-wrap}
.song-actions{display:flex;gap:4px;flex-shrink:0}
.icon-btn{background:none;border:none;cursor:pointer;color:var(--text3);font-size:13px;padding:5px 7px;border-radius:6px}
.icon-btn:hover{color:var(--text);background:var(--bg2)}
.empty-state{text-align:center;padding:4rem 1rem;color:var(--text3);font-size:14px;line-height:2}
.loading{text-align:center;padding:3rem;color:var(--text3);font-size:14px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:none;align-items:center;justify-content:center;z-index:200}
.modal-overlay.open{display:flex}
.modal-inner{background:#000;border-radius:var(--radius-lg);overflow:hidden;width:min(640px,92vw);aspect-ratio:16/9;position:relative}
.modal-close{position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.6);color:#fff;border:none;border-radius:50%;width:30px;height:30px;font-size:16px;cursor:pointer;z-index:10;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:rgba(0,0,0,0.9)}
.tools-panel{background:var(--bg2);border-radius:var(--radius-lg);border:0.5px solid var(--border);padding:1.25rem;margin:1rem 0;display:none}
.tools-panel.open{display:block}
.tools-title{font-size:14px;font-weight:500;margin-bottom:12px}
.tools-row{display:flex;gap:8px;flex-wrap:wrap}
.tool-action-btn{padding:8px 16px;border-radius:var(--radius);border:0.5px solid var(--border2);font-size:13px;color:var(--text);cursor:pointer;background:var(--bg)}
.tool-action-btn:hover{background:var(--bg3)}
.tool-note{font-size:12px;color:var(--text3);margin-top:10px;line-height:1.6}
.status-dot{width:6px;height:6px;border-radius:50%;background:#4ade80;display:inline-block;margin-right:4px}
@media(max-width:560px){.header-actions{position:static;transform:none;display:flex;justify-content:center;margin-top:10px}.site-header{padding-bottom:1rem}}
@media(max-width:480px){.form-grid{grid-template-columns:1fr}.song-thumb,.song-thumb-placeholder{width:56px;height:42px}}
</style>
</head>
<body>
<div class="container">
  <header class="site-header">
    <div class="site-title">REMEMBER ME</div>
    <div class="site-sub">あなたが聴いてきた音楽は、あなたの歴史です</div>
    <div class="header-actions">
      <button class="tool-btn" onclick="toggleTools()">⚙ ツール</button>
      <button class="theme-btn" id="themeBtn">🌙 ダーク</button>
    </div>
  </header>

  <div class="tools-panel" id="toolsPanel">
    <div class="tools-title">データ管理</div>
    <div class="tools-row">
      <button class="tool-action-btn" onclick="importFromLocal()">📤 ローカルデータを移行</button>
      <button class="tool-action-btn" onclick="exportData()">📥 JSONエクスポート</button>
    </div>
    <div class="tool-note">
      <span class="status-dot"></span>データはSupabaseクラウドに保存されています。どのデバイスからでも同じデータが見えます。<br>
      ローカルデータを移行：このブラウザのlocalStorageに保存されたデータをSupabaseに移行します。
    </div>
  </div>

  <div class="decade-tabs" id="tabs"></div>
  <div id="mainContent"></div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal-inner">
    <button class="modal-close" id="modalClose">✕</button>
    <iframe id="videoFrame" width="100%" height="100%" frameborder="0"
      allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://zpwcwtxnxvztqdxxgusp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Dr8P0VV9Xd4hEEWJqbdrEw_zXBJDYp1';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const DECADES = ['1950s','1960s','1970s','1980s','1990s','2000s','2010s','2020s'];
const LOCAL_KEY = 'rememberme_v2';
let active = '1980s';
let formOpen = false;
let editId = null;
let dark = false;
let toolsOpen = false;
let songs = {};
DECADES.forEach(d => songs[d] = []);

// テーマ
try {
  const s = JSON.parse(localStorage.getItem(LOCAL_KEY) || '{}');
  if(s._dark){ dark = true; document.documentElement.setAttribute('data-theme','dark'); }
} catch(e){}

function saveDark(){
  try {
    const s = JSON.parse(localStorage.getItem(LOCAL_KEY) || '{}');
    s._dark = dark;
    localStorage.setItem(LOCAL_KEY, JSON.stringify(s));
  } catch(e){}
}

function ytId(url){
  const m = (url||'').match(/(?:youtu\.be\/|[?&]v=|embed\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function decadeOptions(sel){
  return DECADES.map(d=>`<option value="${d}"${d===sel?' selected':''}>${d}</option>`).join('');
}

// Supabaseからデータ読み込み
async function loadSongs(){
  document.getElementById('mainContent').innerHTML = '<div class="loading">読み込み中...</div>';
  const { data, error } = await sb.from('songs').select('*').order('rank_order');
  if(error){ console.error(error); return; }
  DECADES.forEach(d => songs[d] = []);
  (data||[]).forEach(s => {
    if(songs[s.decade]) songs[s.decade].push(s);
  });
  renderTabs();
  renderMain();
}

// 曲を追加
async function addSong(song){
  const maxRank = songs[song.decade].length;
  const { data, error } = await sb.from('songs').insert([{...song, rank_order: maxRank}]).select();
  if(error){ alert('保存に失敗しました: ' + error.message); return false; }
  songs[song.decade].push(data[0]);
  return true;
}

// 曲を更新
async function updateSong(id, song){
  const { error } = await sb.from('songs').update(song).eq('id', id);
  if(error){ alert('更新に失敗しました: ' + error.message); return false; }
  return true;
}

// 曲を削除
async function deleteSong(id){
  const { error } = await sb.from('songs').delete().eq('id', id);
  if(error){ alert('削除に失敗しました: ' + error.message); return false; }
  return true;
}

function renderTabs(){
  document.getElementById('tabs').innerHTML = DECADES.map(d=>
    `<button class="tab${d===active?' active':''}" onclick="setDec('${d}')">${d}<span class="tab-count">${songs[d].length||''}</span></button>`
  ).join('');
}

function renderMain(){
  const list = songs[active];
  const canAdd = list.length < 100;
  const isEdit = editId !== null;
  const ed = isEdit ? list.find(s=>s.id===editId) : null;

  const formHtml = `
  <div class="form-panel${formOpen?' open':''}" id="addForm">
    <div class="form-title">${isEdit?'曲を編集':'曲を追加'}</div>
    <div class="form-grid">
      <div><label class="form-label">アーティスト名 *</label><input id="fArtist" placeholder="Elvis Presley" value="${isEdit?esc(ed.artist):''}" /></div>
      <div><label class="form-label">曲名 *</label><input id="fTitle" placeholder="Hound Dog" value="${isEdit?esc(ed.title):''}" /></div>
      <div><label class="form-label">年代 *</label><select id="fDecade">${decadeOptions(isEdit?(ed.decade||active):active)}</select></div>
      <div><label class="form-label">リリース年<span class="form-optional">任意</span></label><input id="fYear" placeholder="1956" maxlength="4" value="${isEdit&&ed.year?ed.year:''}" /></div>
      <div class="form-full"><label class="form-label">YouTube URL<span class="form-optional">任意</span></label><input id="fUrl" placeholder="https://www.youtube.com/watch?v=..." value="${isEdit?esc(ed.url||''):''}" /></div>
      <div class="form-full"><label class="form-label">コメント<span class="form-optional">任意</span></label><textarea id="fComment" placeholder="どんな時に聴いてた？どこで知った？...">${isEdit?esc(ed.comment||''):''}</textarea></div>
    </div>
    <div class="form-actions">
      <button class="btn-cancel" onclick="cancelForm()">キャンセル</button>
      <button class="btn-save" onclick="saveSong()">${isEdit?'更新する':'追加する'}</button>
    </div>
  </div>`;

  const listHtml = list.length===0
    ? `<div class="empty-state">まだ曲が登録されていません<br>「+ 曲を追加」から始めましょう</div>`
    : `<div class="song-list" id="songList">${list.map(songCard).join('')}</div>`;

  document.getElementById('mainContent').innerHTML = `
  <div class="section-header">
    <div class="section-title">${active}<span class="section-count">${list.length} / 100</span></div>
    ${canAdd?`<button class="add-btn" onclick="openAdd()">+ 曲を追加</button>`:'<span style="font-size:13px;color:var(--text3)">100曲達成！</span>'}
  </div>
  ${formHtml}${listHtml}`;

  initDrag();
}

function songCard(s){
  const id = ytId(s.url);
  const thumb = id
    ? `<img class="song-thumb" src="https://img.youtube.com/vi/${id}/mqdefault.jpg" alt="" onerror="this.style.display='none'">`
    : `<div class="song-thumb-placeholder">♪</div>`;
  return `
  <div class="song-card" draggable="true" data-id="${s.id}">
    <div class="drag-handle">⠿</div>
    <div class="rank">${songs[active].indexOf(s)+1}</div>
    ${thumb}
    <div class="song-info">
      <div class="song-title">${esc(s.title)}</div>
      <div class="song-meta">
        <span class="song-artist">${esc(s.artist)}</span>
        ${s.year?`<span class="song-year">${esc(s.year)}</span>`:''}
      </div>
      ${s.comment?`<div class="song-comment">${esc(s.comment)}</div>`:''}
    </div>
    <div class="song-actions">
      ${id?`<button class="icon-btn" onclick="play('${id}')" title="再生">▶</button>`:''}
      <button class="icon-btn" onclick="editSong(${s.id})" title="編集">✎</button>
      <button class="icon-btn" onclick="delSong(${s.id})" title="削除">✕</button>
    </div>
  </div>`;
}

function setDec(d){ active=d; formOpen=false; editId=null; renderTabs(); renderMain(); }
function openAdd(){ formOpen=true; editId=null; renderMain(); }
function cancelForm(){ formOpen=false; editId=null; renderMain(); }

function editSong(id){
  editId=id; formOpen=true; renderMain();
  document.getElementById('addForm').scrollIntoView({behavior:'smooth',block:'nearest'});
}

async function saveSong(){
  const artist = document.getElementById('fArtist').value.trim();
  const title = document.getElementById('fTitle').value.trim();
  const decade = document.getElementById('fDecade').value;
  const year = document.getElementById('fYear').value.trim();
  const url = document.getElementById('fUrl').value.trim();
  const comment = document.getElementById('fComment').value.trim();
  if(!artist||!title){ alert('アーティスト名と曲名は必須です'); return; }

  const btn = document.querySelector('.btn-save');
  btn.textContent = '保存中...'; btn.disabled = true;

  const songData = {artist, title, decade, year: year||null, url: url||null, comment: comment||null};

  if(editId !== null){
    const oldSong = songs[active].find(s=>s.id===editId);
    const ok = await updateSong(editId, songData);
    if(ok){
      if(decade !== active){
        songs[active] = songs[active].filter(s=>s.id!==editId);
        songs[decade].push({...oldSong, ...songData});
      } else {
        const idx = songs[active].findIndex(s=>s.id===editId);
        songs[active][idx] = {...oldSong, ...songData};
      }
      active = decade;
    }
  } else {
    const ok = await addSong(songData);
    if(ok) active = decade;
  }

  formOpen=false; editId=null;
  renderTabs(); renderMain();
}

async function delSong(id){
  if(!confirm('この曲を削除しますか？')) return;
  const ok = await deleteSong(id);
  if(ok){
    songs[active] = songs[active].filter(s=>s.id!==id);
    renderTabs(); renderMain();
  }
}

function play(id){
  document.getElementById('videoFrame').src=`https://www.youtube.com/embed/${id}?autoplay=1`;
  document.getElementById('modal').classList.add('open');
}

document.getElementById('modalClose').onclick=function(){
  document.getElementById('modal').classList.remove('open');
  document.getElementById('videoFrame').src='';
};
document.getElementById('modal').onclick=function(e){
  if(e.target===this){ this.classList.remove('open'); document.getElementById('videoFrame').src=''; }
};

document.getElementById('themeBtn').onclick=function(){
  dark=!dark;
  document.documentElement.setAttribute('data-theme',dark?'dark':'');
  this.textContent=dark?'☀️ ライト':'🌙 ダーク';
  saveDark();
};
if(dark) document.getElementById('themeBtn').textContent='☀️ ライト';

function toggleTools(){
  toolsOpen=!toolsOpen;
  document.getElementById('toolsPanel').classList.toggle('open',toolsOpen);
}

// localStorageからSupabaseへ移行
async function importFromLocal(){
  const raw = localStorage.getItem(LOCAL_KEY);
  if(!raw){ alert('移行するローカルデータがありません'); return; }
  const local = JSON.parse(raw);
  let count = 0;
  for(const d of DECADES){
    if(!local[d]||!Array.isArray(local[d])) continue;
    for(let i=0; i<local[d].length; i++){
      const s = local[d][i];
      if(!s.artist||!s.title) continue;
      const exists = songs[d].some(x=>x.artist===s.artist&&x.title===s.title);
      if(exists) continue;
      const { error } = await sb.from('songs').insert([{
        decade: d, rank_order: songs[d].length + i,
        artist: s.artist, title: s.title,
        year: s.year||null, url: s.url||null, comment: s.comment||null
      }]);
      if(!error) count++;
    }
  }
  alert(`${count}曲を移行しました！`);
  await loadSongs();
}

// エクスポート
function exportData(){
  const exportObj = {};
  DECADES.forEach(d => { if(songs[d].length>0) exportObj[d]=songs[d]; });
  const total = DECADES.reduce((n,d)=>n+songs[d].length,0);
  if(total===0){ alert('エクスポートするデータがありません'); return; }
  const blob = new Blob([JSON.stringify(exportObj,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=`remember-me-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(url);
}

// ドラッグ＆ドロップ
let dragSrc=null;
function initDrag(){
  const list=document.getElementById('songList');
  if(!list) return;
  list.querySelectorAll('.song-card').forEach(card=>{
    card.addEventListener('dragstart',e=>{
      dragSrc=card.dataset.id;
      setTimeout(()=>card.classList.add('dragging'),0);
      e.dataTransfer.effectAllowed='move';
    });
    card.addEventListener('dragend',()=>card.classList.remove('dragging'));
    card.addEventListener('dragover',e=>{ e.preventDefault(); card.classList.add('drag-over'); });
    card.addEventListener('dragleave',()=>card.classList.remove('drag-over'));
    card.addEventListener('drop',async e=>{
      e.preventDefault(); card.classList.remove('drag-over');
      const targetId = card.dataset.id;
      if(!dragSrc||dragSrc===targetId) return;
      const arr = songs[active];
      const fromIdx = arr.findIndex(s=>String(s.id)===dragSrc);
      const toIdx = arr.findIndex(s=>String(s.id)===targetId);
      if(fromIdx===-1||toIdx===-1) return;
      const [moved] = arr.splice(fromIdx,1);
      arr.splice(toIdx,0,moved);
      renderMain();
      // rank_orderを更新
      for(let i=0;i<arr.length;i++){
        await sb.from('songs').update({rank_order:i}).eq('id',arr[i].id);
      }
    });
  });
}

loadSongs();
</script>
</body>
</html>
