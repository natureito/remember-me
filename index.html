<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
  <link rel="icon" type="image/png" href="favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REMEMBER ME</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#ffffff;--bg2:#f5f5f3;--bg3:#eeede9;--text:#1a1a1a;--text2:#666;--text3:#999;--border:rgba(0,0,0,0.12);--border2:rgba(0,0,0,0.2);--radius:8px;--radius-lg:12px}
[data-theme="dark"]{--bg:#1a1a1a;--bg2:#242424;--bg3:#2e2e2e;--text:#f0f0f0;--text2:#aaa;--text3:#666;--border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.2)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background 0.2s,color 0.2s;padding-bottom:120px}
.container{max-width:760px;margin:0 auto;padding:0 1.25rem}
.site-header{padding:2rem 0 1.5rem;text-align:center;border-bottom:0.5px solid var(--border);position:relative}
.site-title{font-size:32px;font-weight:500;letter-spacing:0.08em}
.site-sub{font-size:13px;color:var(--text2);margin-top:8px;line-height:1.6}
.header-actions{position:absolute;top:50%;right:0;transform:translateY(-50%);display:flex;gap:6px;align-items:center}
.theme-btn,.tool-btn{background:none;border:0.5px solid var(--border2);border-radius:var(--radius);padding:6px 12px;font-size:12px;color:var(--text2);cursor:pointer}
.theme-btn:hover,.tool-btn:hover{background:var(--bg2)}
.decade-tabs{display:flex;gap:6px;padding:1.25rem 0 0;overflow-x:auto;scrollbar-width:none}
.decade-tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:6px 16px;border-radius:var(--radius);border:0.5px solid var(--border);font-size:13px;color:var(--text2);cursor:pointer;background:transparent;transition:all 0.15s;font-weight:500}
.tab:hover{background:var(--bg2)}
.tab.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.tab-count{font-size:11px;opacity:0.6;margin-left:4px}
.swipe-area{overflow:hidden;position:relative}
.swipe-inner{transition:transform 0.3s cubic-bezier(0.25,0.46,0.45,0.94);will-change:transform}

/* タグタブ（サブ） */
.tag-tabs-wrap{padding:6px 0 0;display:none}
.tag-tabs-wrap.has-tags{display:block}
.tag-tabs-label{font-size:10px;color:var(--text3);letter-spacing:0.05em;margin-bottom:5px}
.tag-tabs{display:flex;flex-wrap:wrap;gap:5px}
.tag-tab{padding:3px 10px;border-radius:20px;border:0.5px solid var(--border);font-size:11px;color:var(--text3);cursor:pointer;background:transparent;transition:all 0.15s}
.tag-tab:hover{background:var(--bg2);color:var(--text2)}
.tag-tab.active{background:#6e8efb22;color:#6e8efb;border-color:#6e8efb}
.section-header{display:flex;align-items:center;justify-content:space-between;padding:1.5rem 0 0.75rem}
.section-title{font-size:20px;font-weight:500}
.section-count{font-size:13px;font-weight:400;color:var(--text3);margin-left:8px}
.section-actions{display:flex;gap:6px;align-items:center}
.add-btn{padding:7px 16px;border-radius:var(--radius);border:0.5px solid var(--border2);font-size:13px;color:var(--text);cursor:pointer;background:transparent}
.add-btn:hover{background:var(--bg2)}
.play-menu-btn{padding:7px 12px;border-radius:var(--radius);border:0.5px solid var(--border2);font-size:13px;color:var(--text2);cursor:pointer;background:transparent;position:relative}
.play-menu-btn:hover{background:var(--bg2)}
.play-dropdown{position:absolute;top:calc(100% + 4px);right:0;background:var(--bg);border:0.5px solid var(--border2);border-radius:var(--radius-lg);padding:6px;min-width:200px;z-index:50;display:none;box-shadow:0 4px 20px rgba(0,0,0,0.15)}
.play-dropdown.open{display:block}
.play-option{display:block;width:100%;text-align:left;padding:8px 12px;border:none;background:none;font-size:13px;color:var(--text);cursor:pointer;border-radius:var(--radius)}
.play-option:hover{background:var(--bg2)}
.play-divider{height:0.5px;background:var(--border);margin:4px 0}
.form-panel{background:var(--bg2);border-radius:var(--radius-lg);border:0.5px solid var(--border);padding:1.25rem;margin-bottom:1rem;display:none}
.form-panel.open{display:block}
.form-title{font-size:14px;font-weight:500;margin-bottom:12px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.form-full{grid-column:1/-1}
.form-label{font-size:12px;color:var(--text2);margin-bottom:4px;display:block}
.form-optional{font-size:11px;color:var(--text3);margin-left:4px}
input,textarea,select{width:100%;border:0.5px solid var(--border);border-radius:var(--radius);padding:8px 10px;font-size:13px;background:var(--bg);color:var(--text);font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--border2)}
textarea{resize:vertical;min-height:64px}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.btn-save{padding:7px 20px;border-radius:var(--radius);background:var(--text);color:var(--bg);border:none;font-size:13px;cursor:pointer}
.btn-cancel{padding:7px 16px;border-radius:var(--radius);background:transparent;color:var(--text2);border:0.5px solid var(--border);font-size:13px;cursor:pointer}

/* タグ選択（フォーム内） */
.tag-select-area{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0}
.tag-chip{padding:4px 10px;border-radius:20px;font-size:12px;border:0.5px solid var(--border2);cursor:pointer;background:transparent;color:var(--text2);transition:all 0.15s}
.tag-chip.selected{background:var(--text);color:var(--bg);border-color:var(--text)}
.tag-chip:hover{background:var(--bg3)}

.song-list{display:flex;flex-direction:column;gap:8px;padding-bottom:1rem}
.song-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px;display:flex;gap:12px;align-items:flex-start;user-select:none;transition:opacity 0.15s,transform 0.15s}
.song-card.playing{border-color:#4ade80;background:var(--bg2)}
.song-card.dragging{opacity:0.35}
.song-card.drag-over{border-color:var(--text2);background:var(--bg2)}
.song-card.touch-dragging{opacity:0.5;transform:scale(1.02);z-index:10;box-shadow:0 8px 24px rgba(0,0,0,0.2)}
.drag-handle{color:var(--text3);font-size:18px;padding-top:3px;flex-shrink:0;cursor:grab;touch-action:none}
.rank{font-size:13px;font-weight:500;color:var(--text3);min-width:22px;padding-top:3px;text-align:right;flex-shrink:0}
.song-thumb{width:72px;height:54px;border-radius:6px;object-fit:cover;flex-shrink:0;background:var(--bg3)}
.song-thumb-placeholder{width:72px;height:54px;border-radius:6px;flex-shrink:0;background:var(--bg3);display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:20px}
.song-info{flex:1;min-width:0}
.song-title{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-meta{display:flex;gap:8px;align-items:center;margin-top:3px;flex-wrap:wrap}
.song-artist{font-size:12px;color:var(--text2)}
.song-year{font-size:11px;color:var(--text3);background:var(--bg3);padding:1px 6px;border-radius:4px;flex-shrink:0}
.song-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.song-tag{font-size:10px;color:var(--text3);background:var(--bg3);padding:1px 6px;border-radius:10px}
.song-comment{font-size:12px;color:var(--text3);margin-top:5px;line-height:1.6;white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.song-comment.expanded{display:block;-webkit-line-clamp:unset}
.comment-toggle{background:none;border:none;font-size:11px;color:var(--text3);cursor:pointer;padding:2px 0;margin-top:2px;display:block}
.comment-toggle:hover{color:var(--text2)}
@media(max-width:600px){
  .song-comment{display:none}.song-comment.expanded{display:block}
  .song-thumb,.song-thumb-placeholder{width:56px;height:42px}
  .form-grid{grid-template-columns:1fr}
  .header-actions{position:static;transform:none;display:flex;justify-content:center;margin-top:10px}
  .site-header{padding-bottom:1rem}
}
.song-actions{display:flex;gap:4px;flex-shrink:0}
.icon-btn{background:none;border:none;cursor:pointer;color:var(--text3);font-size:13px;padding:5px 7px;border-radius:6px}
.icon-btn:hover{color:var(--text);background:var(--bg2)}
.icon-btn.play-active{color:#4ade80}
.empty-state{text-align:center;padding:4rem 1rem;color:var(--text3);font-size:14px;line-height:2}
.loading{text-align:center;padding:3rem;color:var(--text3);font-size:14px}
.swipe-hint{text-align:center;font-size:11px;color:var(--text3);padding:6px 0 0;display:none}
@media(max-width:600px){.swipe-hint{display:block}}

/* 検索 */
.search-bar{display:none;padding:0.75rem 0 0}
.search-bar.open{display:block}
.search-input-wrap{display:flex;align-items:center;gap:8px;background:var(--bg2);border:0.5px solid var(--border2);border-radius:var(--radius-lg);padding:8px 12px}
.search-icon{font-size:14px;flex-shrink:0}
.search-input-wrap input{flex:1;border:none;background:none;font-size:14px;color:var(--text);outline:none;font-family:inherit}
.search-input-wrap input::placeholder{color:var(--text3)}
.search-clear{background:none;border:none;cursor:pointer;color:var(--text3);font-size:14px;padding:0;flex-shrink:0;display:none}
.search-clear.visible{display:block}
.search-results{display:none;padding:0.75rem 0 0}
.search-results.open{display:block}
.search-results-header{font-size:12px;color:var(--text3);margin-bottom:8px}
.search-result-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:10px 14px;display:flex;gap:10px;align-items:center;margin-bottom:6px}
.search-result-thumb{width:56px;height:42px;border-radius:6px;object-fit:cover;flex-shrink:0;background:var(--bg3)}
.search-result-thumb-placeholder{width:56px;height:42px;border-radius:6px;flex-shrink:0;background:var(--bg3);display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:16px}
.search-result-info{flex:1;min-width:0}
.search-result-title{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-result-meta{display:flex;gap:6px;align-items:center;margin-top:3px;flex-wrap:wrap}
.search-result-artist{font-size:12px;color:var(--text2)}
.search-result-decade{font-size:10px;color:var(--text3);background:var(--bg3);padding:1px 6px;border-radius:4px}
.search-result-year{font-size:10px;color:var(--text3);background:var(--bg3);padding:1px 6px;border-radius:4px}
.search-highlight{background:rgba(250,200,0,0.25);border-radius:2px}
.search-no-result{text-align:center;padding:2rem;color:var(--text3);font-size:13px}

/* ミニプレイヤー */
.mini-player{position:fixed;bottom:16px;right:16px;width:300px;background:var(--bg);border:0.5px solid var(--border2);border-radius:var(--radius-lg);box-shadow:0 8px 32px rgba(0,0,0,0.2);z-index:100;display:none;overflow:hidden;user-select:none}
.mini-player.open{display:block}
.mini-player-mode{font-size:10px;color:var(--text3);padding:5px 12px;border-bottom:0.5px solid var(--border);background:var(--bg2);display:flex;align-items:center;justify-content:space-between}
.mp-drag-handle{font-size:12px;color:var(--text3);cursor:grab;padding:0 4px;flex-shrink:0}
.mini-player-header{display:flex;align-items:center;gap:8px;padding:10px 12px}
.mini-player-info{flex:1;min-width:0}
.mini-player-title{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-player-artist{font-size:11px;color:var(--text2);margin-top:1px}
.mini-player-controls{display:flex;gap:2px;align-items:center;flex-shrink:0}
.mp-btn{background:none;border:none;cursor:pointer;color:var(--text2);font-size:15px;padding:4px 6px;border-radius:4px;line-height:1}
.mp-btn:hover{color:var(--text);background:var(--bg2)}
.mp-btn.active{color:#4ade80}
.mini-player-video{width:100%;background:#000;display:none}
.mini-player-video.open{display:block}
.mini-player-queue{font-size:11px;color:var(--text3);padding:5px 12px;border-top:0.5px solid var(--border);text-align:right}
@media(max-width:600px){.mini-player{width:calc(100vw - 32px);bottom:8px;right:16px}}

/* ツールパネル */
.tools-panel{background:var(--bg2);border-radius:var(--radius-lg);border:0.5px solid var(--border);padding:1.25rem;margin:1rem 0;display:none}
.tools-panel.open{display:block}
.tools-title{font-size:14px;font-weight:500;margin-bottom:12px}
.tools-row{display:flex;gap:8px;flex-wrap:wrap}
.tool-action-btn{padding:8px 16px;border-radius:var(--radius);border:0.5px solid var(--border2);font-size:13px;color:var(--text);cursor:pointer;background:var(--bg)}
.tool-action-btn:hover{background:var(--bg3)}
.tool-note{font-size:12px;color:var(--text3);margin-top:10px;line-height:1.6}
.status-dot{width:6px;height:6px;border-radius:50%;background:#4ade80;display:inline-block;margin-right:4px}
.tool-section{margin-top:1rem;padding-top:1rem;border-top:0.5px solid var(--border)}
.tool-section-title{font-size:13px;font-weight:500;margin-bottom:10px;color:var(--text)}
.tag-category{margin-bottom:12px}
.tag-category-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px}
.tag-checkbox-grid{display:flex;flex-wrap:wrap;gap:6px}
.tag-checkbox-item{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--text);cursor:pointer}
.tag-checkbox-item input[type="checkbox"]{width:auto;cursor:pointer}
.tag-custom-row{display:flex;gap:8px;margin-top:8px}
.tag-custom-row input{flex:1}
.tag-custom-row button{padding:7px 14px;border-radius:var(--radius);border:0.5px solid var(--border2);font-size:13px;color:var(--text);cursor:pointer;background:var(--bg);white-space:nowrap}
</style>
</head>
<body>
<script>
  var tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);
</script>

<div class="container">
  <header class="site-header">
    <div class="site-title">REMEMBER ME</div>
    <div class="site-sub">あなたが聴いてきた音楽は、あなたの歴史です</div>
    <div class="header-actions">
      <button class="tool-btn" onclick="toggleSearch()">🔍</button>
      <button class="tool-btn" onclick="toggleTools()">⚙ ツール</button>
      <button class="theme-btn" id="themeBtn">🌙 ダーク</button>
    </div>
  </header>

  <div class="search-bar" id="searchBar">
    <div class="search-input-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="アーティスト名・曲名・コメントで検索..." oninput="doSearch()" />
      <button class="search-clear" id="searchClear" onclick="clearSearch()">✕</button>
    </div>
  </div>
  <div class="search-results" id="searchResults"></div>

  <div class="tools-panel" id="toolsPanel">
    <div class="tools-title" style="display:flex;align-items:center;justify-content:space-between">データ管理<button onclick="toggleTools()" style="background:none;border:none;font-size:16px;color:var(--text3);cursor:pointer;padding:0">✕</button></div>
    <div class="tools-row">
      <button class="tool-action-btn" onclick="importFromLocal()">📤 ローカルデータを移行</button>
      <button class="tool-action-btn" onclick="exportData()">📥 JSONエクスポート</button>
    </div>
    <div class="tool-note"><span class="status-dot"></span>データはSupabaseクラウドに保存されています。</div>

    <!-- タグ設定 -->
    <div class="tool-section">
      <div class="tool-section-title">🏷 タグ設定（使用するタグを選択）</div>
      <div id="tagSettingsArea">読み込み中...</div>
      <div class="tag-custom-row">
        <input type="text" id="newTagInput" placeholder="オリジナルタグを追加..." maxlength="20" />
        <button onclick="addCustomTag()">+ 追加</button>
      </div>
    </div>
  </div>

  <div class="decade-tabs" id="tabs"></div>
  <div class="tag-tabs-wrap" id="tagTabsWrap">
    <div class="tag-tabs-label">タグで絞り込む</div>
    <div class="tag-tabs" id="tagTabs"></div>
  </div>
  <div class="swipe-hint">← スワイプで年代を切り替え →</div>
  <div class="swipe-area" id="swipeArea">
    <div class="swipe-inner" id="swipeInner">
      <div id="mainContent"></div>
    </div>
  </div>
</div>

<div class="mini-player" id="miniPlayer">
  <div class="mini-player-mode" id="mpMode"><span id="mpModeText"></span><span class="mp-drag-handle" id="mpDragHandle">⠿ ドラッグ</span></div>
  <div class="mini-player-header">
    <div class="mini-player-info">
      <div class="mini-player-title" id="mpTitle">—</div>
      <div class="mini-player-artist" id="mpArtist"></div>
    </div>
    <div class="mini-player-controls">
      <button class="mp-btn" onclick="mpPrev()" title="前へ">⏮</button>
      <button class="mp-btn" onclick="mpToggleVideo()" id="mpVideoBtn" title="動画">▶</button>
      <button class="mp-btn" onclick="mpNext()" title="次へ">⏭</button>
      <button class="mp-btn" onclick="mpClose()" title="閉じる">✕</button>
    </div>
  </div>
  <div class="mini-player-video" id="mpVideoWrap"><div id="ytPlayer"></div></div>
  <div class="mini-player-queue" id="mpQueue"></div>
</div>

<script>
const SUPABASE_URL = 'https://zpwcwtxnxvztqdxxgusp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Dr8P0VV9Xd4hEEWJqbdrEw_zXBJDYp1';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const DECADES = ['1950s','1960s','1970s','1980s','1990s','2000s','2010s','2020s'];
const LOCAL_KEY = 'rememberme_v2';
let active='1980s', formOpen=false, editId=null, dark=false, toolsOpen=false, searchOpen=false;
let songs={}, allTags=[], activeTags=[], songTagMap={};
let activeTagFilter=null; // 選択中のタグID（nullなら年代表示）
DECADES.forEach(d=>songs[d]=[]);
let playlist=[],playIdx=0,playMode='',videoVisible=false,playDropOpen=false;
let ytPlayer=null,ytReady=false;

try{ const s=JSON.parse(localStorage.getItem(LOCAL_KEY)||'{}'); if(s._dark){dark=true;document.documentElement.setAttribute('data-theme','dark');} }catch(e){}
function saveDark(){ try{const s=JSON.parse(localStorage.getItem(LOCAL_KEY)||'{}');s._dark=dark;localStorage.setItem(LOCAL_KEY,JSON.stringify(s));}catch(e){} }

function onYouTubeIframeAPIReady(){
  ytReady=true;
  ytPlayer=new YT.Player('ytPlayer',{width:'100%',height:'169',playerVars:{autoplay:1,rel:0,modestbranding:1},events:{onStateChange:function(e){if(e.data===YT.PlayerState.ENDED)mpNext();}}});
}

function ytId(url){ const m=(url||'').match(/(?:youtu\.be\/|[?&]v=|embed\/)([A-Za-z0-9_-]{11})/); return m?m[1]:null; }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function decadeOptions(sel){ return DECADES.map(d=>`<option value="${d}"${d===sel?' selected':''}>${d}</option>`).join(''); }
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

// --- タグ読み込み ---
async function loadTags(){
  const {data}=await sb.from('tags').select('*').order('category').order('name');
  allTags=data||[];
  activeTags=allTags.filter(t=>t.is_active);
  renderTagSettings();
  renderTagTabs();
}

function renderTagTabs(){
  const el=document.getElementById('tagTabs');
  const wrap=document.getElementById('tagTabsWrap');
  if(activeTags.length===0){el.innerHTML='';wrap.classList.remove('has-tags');return;}
  wrap.classList.add('has-tags');
  el.innerHTML=activeTags.map(t=>
    `<button class="tag-tab${activeTagFilter===t.id?' active':''}" onclick="selectTagFilter(${t.id})">🏷 ${esc(t.name)}</button>`
  ).join('');
}

function selectTagFilter(tagId){
  if(activeTagFilter===tagId){
    // 同じタグをクリックで解除
    activeTagFilter=null;
  } else {
    activeTagFilter=tagId;
    formOpen=false;editId=null;
  }
  renderTagTabs();
  renderMain();
}

async function loadSongTags(){
  const {data}=await sb.from('song_tags').select('song_id,tag_id,tags(name)');
  songTagMap={};
  (data||[]).forEach(r=>{
    if(!songTagMap[r.song_id]) songTagMap[r.song_id]=[];
    songTagMap[r.song_id].push({id:r.tag_id,name:r.tags?.name});
  });
}

function renderTagSettings(){
  const categories=[...new Set(allTags.map(t=>t.category))].filter(Boolean);
  const el=document.getElementById('tagSettingsArea');
  let html='';
  categories.forEach(cat=>{
    const tags=allTags.filter(t=>t.category===cat);
    html+=`<div class="tag-category">
      <div class="tag-category-label">${esc(cat)}</div>
      <div class="tag-checkbox-grid">
        ${tags.map(t=>`
          <label class="tag-checkbox-item">
            <input type="checkbox" ${t.is_active?'checked':''} onchange="toggleTagActive(${t.id},this.checked)" />
            ${esc(t.name)}
          </label>`).join('')}
      </div>
    </div>`;
  });
  // カスタムタグ（編集・削除ボタン付き）
  const custom=allTags.filter(t=>!t.is_preset);
  if(custom.length>0){
    html+=`<div class="tag-category">
      <div class="tag-category-label">オリジナル</div>
      <div style="display:flex;flex-direction:column;gap:6px">
        ${custom.map(t=>`
          <div style="display:flex;align-items:center;gap:8px">
            <label class="tag-checkbox-item" style="flex:1">
              <input type="checkbox" ${t.is_active?'checked':''} onchange="toggleTagActive(${t.id},this.checked)" />
              <span id="tag-label-${t.id}">${esc(t.name)}</span>
            </label>
            <button onclick="editCustomTag(${t.id})" style="padding:2px 8px;font-size:11px;border:0.5px solid var(--border2);border-radius:4px;background:none;color:var(--text2);cursor:pointer">✎</button>
            <button onclick="deleteCustomTag(${t.id})" style="padding:2px 8px;font-size:11px;border:0.5px solid var(--border2);border-radius:4px;background:none;color:#e05555;cursor:pointer">✕</button>
          </div>`).join('')}
      </div>
    </div>`;
  }
  el.innerHTML=html||'タグがありません';
}

async function toggleTagActive(id,isActive){
  await sb.from('tags').update({is_active:isActive}).eq('id',id);
  const t=allTags.find(x=>x.id===id);
  if(t) t.is_active=isActive;
  activeTags=allTags.filter(t=>t.is_active);
  if(activeTagFilter&&!activeTags.some(t=>t.id===activeTagFilter)) activeTagFilter=null;
  renderTagTabs();
}

async function addCustomTag(){
  const input=document.getElementById('newTagInput');
  const name=input.value.trim();
  if(!name) return;
  if(allTags.some(t=>t.name===name)){alert('同じ名前のタグが既にあります');return;}
  const {data,error}=await sb.from('tags').insert([{name,category:null,is_preset:false,is_active:true}]).select();
  if(!error&&data){
    allTags.push(data[0]);
    activeTags=allTags.filter(t=>t.is_active);
    renderTagSettings();
    input.value='';
  }
}

async function editCustomTag(id){
  const t=allTags.find(x=>x.id===id); if(!t) return;
  const newName=prompt('タグ名を編集してください',t.name);
  if(!newName||newName===t.name) return;
  if(allTags.some(x=>x.name===newName&&x.id!==id)){alert('同じ名前のタグが既にあります');return;}
  const {error}=await sb.from('tags').update({name:newName}).eq('id',id);
  if(!error){ t.name=newName; activeTags=allTags.filter(x=>x.is_active); renderTagSettings(); }
}

async function deleteCustomTag(id){
  const t=allTags.find(x=>x.id===id); if(!t) return;
  if(!confirm(`「${t.name}」を削除しますか？\n曲に付けたこのタグも全て外れます。`)) return;
  const {error}=await sb.from('tags').delete().eq('id',id);
  if(!error){
    allTags=allTags.filter(x=>x.id!==id);
    activeTags=allTags.filter(x=>x.is_active);
    if(activeTagFilter===id) activeTagFilter=null;
    Object.keys(songTagMap).forEach(sid=>{ songTagMap[sid]=songTagMap[sid].filter(x=>x.id!==id); });
    renderTagSettings();
    renderTagTabs();
  }
}

// --- 曲読み込み ---
async function loadSongs(){
  document.getElementById('mainContent').innerHTML='<div class="loading">読み込み中...</div>';
  const [{data:songData},{data:tagData}]=await Promise.all([
    sb.from('songs').select('*').order('rank_order'),
    sb.from('song_tags').select('song_id,tag_id,tags(name)')
  ]);
  DECADES.forEach(d=>songs[d]=[]);
  (songData||[]).forEach(s=>{if(songs[s.decade])songs[s.decade].push(s);});
  songTagMap={};
  (tagData||[]).forEach(r=>{
    if(!songTagMap[r.song_id])songTagMap[r.song_id]=[];
    songTagMap[r.song_id].push({id:r.tag_id,name:r.tags?.name});
  });
  renderTabs();renderMain();
}

// --- 再生 ---
function startPlay(mode,tagId){
  playDropOpen=false;playMode=mode;
  let list=[];
  if(mode==='order') list=songs[active].filter(s=>ytId(s.url));
  else if(mode==='shuffle') list=shuffle(songs[active].filter(s=>ytId(s.url)));
  else if(mode==='all'){DECADES.forEach(d=>list.push(...songs[d].filter(s=>ytId(s.url))));list=shuffle(list);}
  else if(mode==='tag'&&tagId){
    DECADES.forEach(d=>list.push(...songs[d].filter(s=>ytId(s.url)&&(songTagMap[s.id]||[]).some(t=>t.id===tagId))));
    list=shuffle(list);
  }
  if(list.length===0){alert('再生できる曲がありません');return;}
  playlist=list;playIdx=0;videoVisible=true;
  document.getElementById('mpVideoWrap').classList.add('open');
  document.getElementById('mpVideoBtn').classList.add('active');
  document.getElementById('miniPlayer').classList.add('open');
  playCurrent();renderMain();
}

function playCurrent(){
  const s=playlist[playIdx];if(!s)return;
  const id=ytId(s.url);
  document.getElementById('mpTitle').textContent=s.title;
  document.getElementById('mpArtist').textContent=s.artist+(s.year?' · '+s.year:'');
  document.getElementById('mpModeText').textContent=
    playMode==='order'?`▶ ${active} 順番`:
    playMode==='shuffle'?`🔀 ${active}`:
    playMode==='single'?'▶ 1曲':
    playMode==='tag'?'🏷 タグ再生':'🌐 全年代';
  document.getElementById('mpQueue').textContent=playlist.length>1?`${playIdx+1} / ${playlist.length}曲`:'';
  if(videoVisible&&ytPlayer&&ytReady&&id)try{ytPlayer.loadVideoById(id);}catch(e){}
  renderMain();
}

function mpNext(){if(!playlist.length)return;playIdx=(playIdx+1)%playlist.length;playCurrent();}
function mpPrev(){if(!playlist.length)return;playIdx=(playIdx-1+playlist.length)%playlist.length;playCurrent();}
function mpToggleVideo(){
  videoVisible=!videoVisible;
  document.getElementById('mpVideoWrap').classList.toggle('open',videoVisible);
  document.getElementById('mpVideoBtn').classList.toggle('active',videoVisible);
  if(videoVisible&&playlist[playIdx]&&ytPlayer&&ytReady){const id=ytId(playlist[playIdx].url);if(id)try{ytPlayer.loadVideoById(id);}catch(e){}}
  else if(!videoVisible&&ytPlayer&&ytReady)try{ytPlayer.pauseVideo();}catch(e){}
}
function mpClose(){
  playlist=[];playIdx=0;playMode='';
  document.getElementById('miniPlayer').classList.remove('open');
  document.getElementById('mpVideoWrap').classList.remove('open');
  document.getElementById('mpVideoBtn').classList.remove('active');
  videoVisible=false;
  if(ytPlayer&&ytReady)try{ytPlayer.stopVideo();}catch(e){}
  renderMain();
}
function togglePlayDropdown(){playDropOpen=!playDropOpen;renderMain();}
function playTagSong(id,decade){
  const s=songs[decade]&&songs[decade].find(x=>x.id===id);if(!s)return;
  playlist=[s];playIdx=0;playMode='single';videoVisible=true;
  document.getElementById('mpVideoWrap').classList.add('open');
  document.getElementById('mpVideoBtn').classList.add('active');
  document.getElementById('miniPlayer').classList.add('open');
  playCurrent();
}

function playOne(id){
  const s=songs[active].find(x=>x.id===id);if(!s)return;
  playlist=[s];playIdx=0;playMode='single';videoVisible=true;
  document.getElementById('mpVideoWrap').classList.add('open');
  document.getElementById('mpVideoBtn').classList.add('active');
  document.getElementById('miniPlayer').classList.add('open');
  playCurrent();
}

// --- スワイプ（スライドアニメーション付き） ---
let swipeStartX=0,swipeStartY=0,swipeActive=false,swipeLocked=false;
const swipeArea=document.getElementById('swipeArea');
const swipeInner=document.getElementById('swipeInner');

swipeArea.addEventListener('touchstart',e=>{
  if(activeTagFilter!==null) return;
  swipeStartX=e.touches[0].clientX;
  swipeStartY=e.touches[0].clientY;
  swipeActive=true;swipeLocked=false;
  swipeInner.style.transition='none';
},{passive:true});

swipeArea.addEventListener('touchmove',e=>{
  if(!swipeActive)return;
  const dx=e.touches[0].clientX-swipeStartX;
  const dy=e.touches[0].clientY-swipeStartY;
  if(!swipeLocked){
    if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>8){swipeLocked=true;}
    else if(Math.abs(dy)>Math.abs(dx)&&Math.abs(dy)>8){swipeActive=false;return;}
  }
  if(swipeLocked){
    const idx=DECADES.indexOf(active);
    const limitedDx=(idx===0&&dx>0)||(idx===DECADES.length-1&&dx<0)?dx*0.2:dx;
    swipeInner.style.transform=`translateX(${limitedDx}px)`;
  }
},{passive:true});

swipeArea.addEventListener('touchend',e=>{
  if(!swipeActive)return;
  const dx=e.changedTouches[0].clientX-swipeStartX;
  swipeInner.style.transition='transform 0.3s cubic-bezier(0.25,0.46,0.45,0.94)';
  if(swipeLocked&&Math.abs(dx)>60){
    const w=swipeArea.offsetWidth;
    const idx=DECADES.indexOf(active);
    if(dx<0&&idx<DECADES.length-1){
      swipeInner.style.transform=`translateX(-${w}px)`;
      setTimeout(()=>{ swipeInner.style.transition='none';swipeInner.style.transform='translateX(100%)';setDec(DECADES[idx+1]);setTimeout(()=>{swipeInner.style.transition='transform 0.3s cubic-bezier(0.25,0.46,0.45,0.94)';swipeInner.style.transform='translateX(0)';},10); },280);
    } else if(dx>0&&idx>0){
      swipeInner.style.transform=`translateX(${w}px)`;
      setTimeout(()=>{ swipeInner.style.transition='none';swipeInner.style.transform='translateX(-100%)';setDec(DECADES[idx-1]);setTimeout(()=>{swipeInner.style.transition='transform 0.3s cubic-bezier(0.25,0.46,0.45,0.94)';swipeInner.style.transform='translateX(0)';},10); },280);
    } else {
      swipeInner.style.transform='translateX(0)';
    }
  } else {
    swipeInner.style.transform='translateX(0)';
  }
  swipeActive=false;swipeLocked=false;
},{passive:true});

function renderMain(){
  // タグフィルター中の場合
  if(activeTagFilter!==null){
    const tag=activeTags.find(t=>t.id===activeTagFilter);
    const taggedSongs=[];
    DECADES.forEach(d=>songs[d].forEach(s=>{
      if((songTagMap[s.id]||[]).some(t=>t.id===activeTagFilter)) taggedSongs.push({...s,_decade:d});
    }));
    const hasPlayable=taggedSongs.some(s=>ytId(s.url));
    const listHtml=taggedSongs.length===0

      :`<div class="song-list">${taggedSongs.map(s=>{
          const id=ytId(s.url);
          const isPlaying=playlist.length>0&&playlist[playIdx]&&playlist[playIdx].id===s.id;
          const thumb=id?`<img class="song-thumb" src="https://img.youtube.com/vi/${id}/mqdefault.jpg" alt="" onerror="this.style.display='none'">`:`<div class="song-thumb-placeholder">♪</div>`;
          return `<div class="song-card${isPlaying?' playing':''}" data-id="${s.id}">
            <div class="rank" style="padding-top:3px">${esc(s._decade)}</div>
            ${thumb}
            <div class="song-info">
              <div class="song-title">${isPlaying?'♪ ':''}${esc(s.title)}</div>
              <div class="song-meta"><span class="song-artist">${esc(s.artist)}</span>${s.year?`<span class="song-year">${esc(s.year)}</span>`:''}</div>
            </div>
            <div class="song-actions">${id?`<button class="icon-btn${isPlaying?' play-active':''}" onclick="playTagSong(${s.id},'${s._decade}')" title="再生">▶</button>`:''}</div>
          </div>`;
        }).join('')}</div>`;
    document.getElementById('mainContent').innerHTML=`
    <div class="section-header">
      <div class="section-title">🏷 ${esc(tag?tag.name:'')}<span class="section-count">${taggedSongs.length}曲</span></div>
      ${hasPlayable?`<button class="play-menu-btn" onclick="startPlay('tag',${activeTagFilter})">🔀 シャッフル再生</button>`:''}
    </div>
    ${listHtml}`;
    return;
  }

  const list=songs[active],canAdd=list.length<100;
  const isEdit=editId!==null,ed=isEdit?list.find(s=>s.id===editId):null;
  const hasPlayable=list.some(s=>ytId(s.url));
  const edTags=isEdit?(songTagMap[ed.id]||[]).map(t=>t.id):[];

  // アクティブタグのチップ
  const tagChips=activeTags.map(t=>
    `<span class="tag-chip${edTags.includes(t.id)?' selected':''}" onclick="toggleFormTag(${t.id})">${esc(t.name)}</span>`
  ).join('');

  // タグ別再生オプション
  const tagPlayOptions=activeTags.length>0?`
    <div class="play-divider"></div>
    ${activeTags.map(t=>`<button class="play-option" onclick="startPlay('tag',${t.id})">🏷 ${esc(t.name)}</button>`).join('')}
  `:'';

  const formHtml=`
  <div class="form-panel${formOpen?' open':''}" id="addForm">
    <div class="form-title">${isEdit?'曲を編集':'曲を追加'}</div>
    <div class="form-grid">
      <div><label class="form-label">アーティスト名 *</label><input id="fArtist" placeholder="Elvis Presley" value="${isEdit?esc(ed.artist):''}" /></div>
      <div><label class="form-label">曲名 *</label><input id="fTitle" placeholder="Hound Dog" value="${isEdit?esc(ed.title):''}" /></div>
      <div><label class="form-label">年代 *</label><select id="fDecade">${decadeOptions(isEdit?(ed.decade||active):active)}</select></div>
      <div><label class="form-label">リリース年<span class="form-optional">任意</span></label><input id="fYear" placeholder="1956" maxlength="4" value="${isEdit&&ed.year?ed.year:''}" /></div>
      <div class="form-full"><label class="form-label">YouTube URL<span class="form-optional">任意</span></label><input id="fUrl" placeholder="https://www.youtube.com/watch?v=..." value="${isEdit?esc(ed.url||''):''}" /></div>
      <div class="form-full"><label class="form-label">コメント<span class="form-optional">任意</span></label><textarea id="fComment" placeholder="どんな時に聴いてた？どこで知った？...">${isEdit?esc(ed.comment||''):''}</textarea></div>
      ${activeTags.length>0?`<div class="form-full"><label class="form-label">タグ<span class="form-optional">任意・複数選択可</span></label><div class="tag-select-area" id="formTagArea">${tagChips}</div></div>`:''}
    </div>
    <div class="form-actions">
      <button class="btn-cancel" onclick="cancelForm()">キャンセル</button>
      <button class="btn-save" onclick="saveSong()">${isEdit?'更新する':'追加する'}</button>
    </div>
  </div>`;

  const listHtml=list.length===0
    ?`<div class="empty-state">まだ曲が登録されていません<br>「+ 曲を追加」から始めましょう</div>`
    :`<div class="song-list" id="songList">${list.map(songCard).join('')}</div>`;

  const playBtn=hasPlayable?`
  <div style="position:relative">
    <button class="play-menu-btn" onclick="togglePlayDropdown()">▶ 再生 ▾</button>

      ${tagPlayOptions}

  document.getElementById('mainContent').innerHTML=`
  <div class="section-header">
    <div class="section-title">${active}<span class="section-count">${list.length} / 100</span></div>
    <div class="section-actions">${playBtn}${canAdd?`<button class="add-btn" onclick="openAdd()">+ 曲を追加</button>`:'<span style="font-size:13px;color:var(--text3)">100曲達成！</span>'}</div>
  </div>

}

// フォーム内タグ選択
let formSelectedTags=[];
function toggleFormTag(tagId){
  const chips=document.querySelectorAll('#formTagArea .tag-chip');
  const idx=formSelectedTags.indexOf(tagId);
  if(idx===-1)formSelectedTags.push(tagId);
  else formSelectedTags.splice(idx,1);
  chips.forEach(chip=>{
    const id=parseInt(chip.getAttribute('onclick').match(/\d+/)[0]);
    chip.classList.toggle('selected',formSelectedTags.includes(id));
  });
}

function songCard(s){
  const id=ytId(s.url);
  const isPlaying=playlist.length>0&&playlist[playIdx]&&playlist[playIdx].id===s.id;
  const thumb=id?`<img class="song-thumb" src="https://img.youtube.com/vi/${id}/mqdefault.jpg" alt="" onerror="this.style.display='none'">`:`<div class="song-thumb-placeholder">♪</div>`;
  const stags=songTagMap[s.id]||[];
  const tagHtml=stags.length>0?`<div class="song-tags">${stags.map(t=>`<span class="song-tag">${esc(t.name)}</span>`).join('')}</div>`:'';
  const hasComment=s.comment&&s.comment.trim();
  const commentHtml=hasComment?`<div class="song-comment" id="cmt-${s.id}">${esc(s.comment)}</div><button class="comment-toggle" onclick="toggleComment(${s.id})">▼ コメントを見る</button>`:'';
  return `
  <div class="song-card${isPlaying?' playing':''}" data-id="${s.id}">
    <div class="drag-handle">⠿</div>
    <div class="rank">${songs[active].indexOf(s)+1}</div>
    ${thumb}
    <div class="song-info">
      <div class="song-title">${isPlaying?'♪ ':''}${esc(s.title)}</div>
      <div class="song-meta"><span class="song-artist">${esc(s.artist)}</span>${s.year?`<span class="song-year">${esc(s.year)}</span>`:''}</div>

function toggleComment(id){
  const cmt=document.getElementById('cmt-'+id),btn=cmt?cmt.nextElementSibling:null;

  const expanded=cmt.classList.toggle('expanded');

function setDec(d){active=d;formOpen=false;editId=null;playDropOpen=false;activeTagFilter=null;renderTagTabs();renderTabs();renderMain();}
function openAdd(){formOpen=true;editId=null;playDropOpen=false;formSelectedTags=[];renderMain();}
function cancelForm(){formOpen=false;editId=null;formSelectedTags=[];renderMain();}

function editSong(id){
  editId=id;formOpen=true;playDropOpen=false;
  formSelectedTags=(songTagMap[id]||[]).map(t=>t.id);
  renderMain();
  document.getElementById('addForm').scrollIntoView({behavior:'smooth',block:'nearest'});
}

async function saveSong(){
  const artist=document.getElementById('fArtist').value.trim();
  const title=document.getElementById('fTitle').value.trim();
  const decade=document.getElementById('fDecade').value;
  const year=document.getElementById('fYear').value.trim();
  const url=document.getElementById('fUrl').value.trim();
  const comment=document.getElementById('fComment').value.trim();
  if(!artist||!title){alert('アーティスト名と曲名は必須です');return;}
  const btn=document.querySelector('.btn-save');
  btn.textContent='保存中...';btn.disabled=true;
  const songData={artist,title,decade,year:year||null,url:url||null,comment:comment||null};
  let songId=editId;

  if(editId!==null){
    const oldSong=songs[active].find(s=>s.id===editId);
    await sb.from('songs').update(songData).eq('id',editId);
    if(decade!==active){songs[active]=songs[active].filter(s=>s.id!==editId);songs[decade].push({...oldSong,...songData});}
    else{const idx=songs[active].findIndex(s=>s.id===editId);songs[active][idx]={...oldSong,...songData};}
    active=decade;
  } else {
    const maxRank=songs[decade].length;
    const {data}=await sb.from('songs').insert([{...songData,rank_order:maxRank}]).select();
    if(data){songs[decade].push(data[0]);songId=data[0].id;active=decade;}
  }

  // タグ保存
  if(songId){
    await sb.from('song_tags').delete().eq('song_id',songId);
    if(formSelectedTags.length>0){
      await sb.from('song_tags').insert(formSelectedTags.map(tid=>({song_id:songId,tag_id:tid})));
      songTagMap[songId]=activeTags.filter(t=>formSelectedTags.includes(t.id)).map(t=>({id:t.id,name:t.name}));
    } else {
      songTagMap[songId]=[];
    }
  }

  formOpen=false;editId=null;formSelectedTags=[];renderTabs();renderMain();
}

async function delSong(id){
  if(!confirm('この曲を削除しますか？'))return;
  await sb.from('songs').delete().eq('id',id);
  songs[active]=songs[active].filter(s=>s.id!==id);
  delete songTagMap[id];
  renderTabs();renderMain();
}

function highlight(text,query){if(!query||!text)return esc(text||'');const escaped=esc(text);const eq=query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return escaped.replace(new RegExp(eq,'gi'),m=>`<span class="search-highlight">${m}</span>`);}

function doSearch(){
  const q=document.getElementById('searchInput').value.trim();
  document.getElementById('searchClear').classList.toggle('visible',q.length>0);
  const resultsEl=document.getElementById('searchResults');
  if(q.length<1){resultsEl.classList.remove('open');resultsEl.innerHTML='';return;}
  const lower=q.toLowerCase();
  const results=[];
  DECADES.forEach(d=>{songs[d].forEach(s=>{if((s.artist||'').toLowerCase().includes(lower)||(s.title||'').toLowerCase().includes(lower)||(s.comment||'').toLowerCase().includes(lower))results.push({...s,_decade:d});});});
  resultsEl.classList.add('open');
  if(results.length===0){resultsEl.innerHTML=`<div class="search-no-result">「${esc(q)}」に一致する曲は見つかりませんでした</div>`;return;}
  const cards=results.map(s=>{
    const id=ytId(s.url);
    const thumb=id?`<img class="search-result-thumb" src="https://img.youtube.com/vi/${id}/mqdefault.jpg" alt="" onerror="this.style.display='none'">`:`<div class="search-result-thumb-placeholder">♪</div>`;
    return `<div class="search-result-card">${thumb}<div class="search-result-info"><div class="search-result-title">${highlight(s.title,q)}</div><div class="search-result-meta"><span class="search-result-artist">${highlight(s.artist,q)}</span><span class="search-result-decade">${s._decade}</span>${s.year?`<span class="search-result-year">${s.year}</span>`:''}</div></div>${id?`<button class="icon-btn" onclick="playSearchResult(${s.id},'${s._decade}')" title="再生">▶</button>`:''}</div>`;
  }).join('');
  resultsEl.innerHTML=`<div class="search-results-header">${results.length}件見つかりました</div>${cards}`;
}

function playSearchResult(id,decade){
  const s=songs[decade]&&songs[decade].find(x=>x.id===id);if(!s)return;
  playlist=[s];playIdx=0;playMode='single';videoVisible=true;
  document.getElementById('mpVideoWrap').classList.add('open');document.getElementById('mpVideoBtn').classList.add('active');document.getElementById('miniPlayer').classList.add('open');
  playCurrent();
}

async function importFromLocal(){
  const raw=localStorage.getItem(LOCAL_KEY);if(!raw){alert('移行するローカルデータがありません');return;}
  const local=JSON.parse(raw);let count=0;
  for(const d of DECADES){if(!local[d]||!Array.isArray(local[d]))continue;for(let i=0;i<local[d].length;i++){const s=local[d][i];if(!s.artist||!s.title)continue;const exists=songs[d].some(x=>x.artist===s.artist&&x.title===s.title);if(exists)continue;const {error}=await sb.from('songs').insert([{decade:d,rank_order:songs[d].length+i,artist:s.artist,title:s.title,year:s.year||null,url:s.url||null,comment:s.comment||null}]);if(!error)count++;}}
  alert(`${count}曲を移行しました！`);await loadSongs();
}

function exportData(){
  const exportObj={};DECADES.forEach(d=>{if(songs[d].length>0)exportObj[d]=songs[d];});
  const total=DECADES.reduce((n,d)=>n+songs[d].length,0);if(total===0){alert('エクスポートするデータがありません');return;}
  const blob=new Blob([JSON.stringify(exportObj,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`remember-me-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(url);
}


// ======================
// Drag Auto Scroll
// ======================
let autoScrollRaf=null;
let autoScrollSpeed=0;
function startAutoScroll(){
  if(autoScrollRaf) return;
  const loop=()=>{
    if(autoScrollSpeed!==0) window.scrollBy(0,autoScrollSpeed);
    autoScrollRaf=requestAnimationFrame(loop);
  };
  loop();
}
function stopAutoScroll(){
  autoScrollSpeed=0;
  if(autoScrollRaf){
    cancelAnimationFrame(autoScrollRaf);
    autoScrollRaf=null;
  }
}
function updateAutoScroll(y){
  const EDGE=140;
  const MAX_SPEED=35;
  const vh=window.innerHeight;
  if(y<EDGE){
    autoScrollSpeed=-MAX_SPEED*((EDGE-y)/EDGE);
  }else if(y>vh-EDGE){
    autoScrollSpeed=MAX_SPEED*((y-(vh-EDGE))/EDGE);
  }else{
    autoScrollSpeed=0;
  }
}


let dragSrc=null;
function initDrag(){
  const list=document.getElementById('songList');if(!list)return;
  list.querySelectorAll('.song-card').forEach(card=>{
    card.setAttribute('draggable','true');
    card.addEventListener('dragstart',e=>{startAutoScroll();dragSrc=card.dataset.id;setTimeout(()=>card.classList.add('dragging'),0);e.dataTransfer.effectAllowed='move';});
    card.addEventListener('dragend',()=>{stopAutoScroll();card.classList.remove('dragging');});
    card.addEventListener('dragover',e=>{e.preventDefault();updateAutoScroll(e.clientY);card.classList.add('drag-over');});
    card.addEventListener('dragleave',()=>card.classList.remove('drag-over'));
    card.addEventListener('drop',async e=>{
      e.preventDefault();card.classList.remove('drag-over');
      const targetId=card.dataset.id;if(!dragSrc||dragSrc===targetId)return;
      const arr=songs[active];const fromIdx=arr.findIndex(s=>String(s.id)===dragSrc);const toIdx=arr.findIndex(s=>String(s.id)===targetId);
      if(fromIdx===-1||toIdx===-1)return;const [moved]=arr.splice(fromIdx,1);arr.splice(toIdx,0,moved);
      renderMain();for(let i=0;i<arr.length;i++)await sb.from('songs').update({rank_order:i}).eq('id',arr[i].id);
    });
  });
}

function initTouchDrag(){
  const list=document.getElementById('songList');if(!list)return;
  let touchDragEl=null,touchStartY=0,placeholder=null;
  list.querySelectorAll('.drag-handle').forEach(handle=>{
    handle.addEventListener('touchstart',e=>{
      const card=handle.closest('.song-card');touchDragEl=card;startAutoScroll();touchStartY=e.touches[0].clientY;
      card.classList.add('touch-dragging');
      placeholder=document.createElement('div');
      placeholder.style.cssText=`height:${card.offsetHeight}px;border-radius:var(--radius-lg);background:var(--bg3);border:1px dashed var(--border2);margin-bottom:8px`;
      card.after(placeholder);e.preventDefault();
    },{passive:false});
    handle.addEventListener('touchmove',e=>{
      if(!touchDragEl)return;
      const dy=e.touches[0].clientY-touchStartY;
      touchDragEl.style.transform=`translateY(${dy}px) scale(1.02)`;
      const cards=[...list.querySelectorAll('.song-card:not(.touch-dragging)')];
      const finger=e.touches[0].clientY;updateAutoScroll(finger);let target=null;
      for(const c of cards){const rect=c.getBoundingClientRect();if(finger>rect.top&&finger<rect.bottom){target=c;break;}}
      if(target&&placeholder){const rect=target.getBoundingClientRect();if(finger<rect.top+rect.height/2)target.before(placeholder);else target.after(placeholder);}
      e.preventDefault();
    },{passive:false});
    handle.addEventListener('touchend',async e=>{
      stopAutoScroll();
      if(!touchDragEl)return;
      touchDragEl.classList.remove('touch-dragging');touchDragEl.style.transform='';
      if(placeholder){placeholder.replaceWith(touchDragEl);placeholder=null;}
      const newOrder=[...list.querySelectorAll('.song-card')].map(c=>parseInt(c.dataset.id));
      const arr=songs[active];const reordered=newOrder.map(id=>arr.find(s=>s.id===id)).filter(Boolean);
      songs[active]=reordered;touchDragEl=null;renderMain();
      for(let i=0;i<reordered.length;i++)await sb.from('songs').update({rank_order:i}).eq('id',reordered[i].id);
    });
  });
}

// ミニプレイヤードラッグ
(function(){
  const mp=document.getElementById('miniPlayer');const handle=document.getElementById('mpDragHandle');
  let isDragging=false,startX,startY,origLeft,origTop;
  function getPos(){const rect=mp.getBoundingClientRect();return{left:rect.left,top:rect.top};}
  function startDrag(x,y){isDragging=true;const pos=getPos();startX=x;startY=y;origLeft=pos.left;origTop=pos.top;mp.style.right='auto';mp.style.bottom='auto';mp.style.left=origLeft+'px';mp.style.top=origTop+'px';mp.style.transition='none';}
  function moveDrag(x,y){if(!isDragging)return;let newLeft=origLeft+(x-startX),newTop=origTop+(y-startY);newLeft=Math.max(0,Math.min(window.innerWidth-mp.offsetWidth,newLeft));newTop=Math.max(0,Math.min(window.innerHeight-mp.offsetHeight,newTop));mp.style.left=newLeft+'px';mp.style.top=newTop+'px';}
  function endDrag(){isDragging=false;}
  handle.addEventListener('mousedown',e=>{startDrag(e.clientX,e.clientY);e.preventDefault();});
  document.addEventListener('mousemove',e=>{if(isDragging)moveDrag(e.clientX,e.clientY);});
  document.addEventListener('mouseup',endDrag);
  handle.addEventListener('touchstart',e=>{startDrag(e.touches[0].clientX,e.touches[0].clientY);e.preventDefault();},{passive:false});
  document.addEventListener('touchmove',e=>{if(isDragging){moveDrag(e.touches[0].clientX,e.touches[0].clientY);e.preventDefault();}},{passive:false});
  document.addEventListener('touchend',endDrag);
})();
